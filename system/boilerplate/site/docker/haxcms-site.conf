# Apache 2.4 settings for a single standalone HAXsite container.
# Enabled by the site Dockerfile via `a2enconf haxcms-site`; it layers on top
# of the stock php:apache configuration instead of replacing it.
<Directory /var/www/html>
    # let the site's own .htaccess (a managed HAXcms template file) apply
    AllowOverride All
    Require all granted
</Directory>
