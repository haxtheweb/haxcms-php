name: tests
on:
  push:
    branches: [main, master]
  # No branch filter: stacked PRs (base is another feature branch) must run too.
  pull_request:
permissions:
  contents: read
jobs:
  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php-version }})"
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3"]
    runs-on: ubuntu-latest
    # The PHP backend (composer.json, composer.lock, phpunit.xml, lib/, tests/)
    # lives under system/backend/php, so run composer/phpunit from there.
    defaults:
      run:
        working-directory: system/backend/php
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php-version }}
          # Extensions required by composer deps: phpspreadsheet/phpword
          # (dom, simplexml, xml, xmlreader, xmlwriter, zip, gd), dompdf
          # (mbstring, gd, dom), pdfparser (zlib, iconv), guzzle (curl).
          extensions: mbstring, xml, dom, simplexml, gd, zip, curl, intl, fileinfo, iconv, xmlreader, xmlwriter, zlib
          # Mirror the standalone test bootstrap's error_reporting so vendor
          # deprecation notices (dompdf/phpoffice) don't noise up the run.
          ini-values: "error_reporting=E_ALL & ~E_NOTICE & ~E_DEPRECATED"
          coverage: none
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('system/backend/php/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run PHPUnit
        run: vendor/bin/phpunit
  # Dependency vulnerability audit (haxtheweb/issues#3092).
  # REPORTING ONLY for now: the audit step uses continue-on-error, so a finding
  # shows up as a warning annotation + log output but does not turn the "tests"
  # check red. Remove `continue-on-error` below once the baseline is clean to
  # make it a blocking gate. Kept as its own job so PHPUnit is unaffected.
  composer-audit:
    name: "Composer audit (reporting only)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system/backend/php
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Composer audit (reporting only, does not fail the build)
        id: audit
        # --locked audits composer.lock directly; no install needed.
        # Exit code is non-zero when advisories (or abandoned packages) exist.
        continue-on-error: true
        run: composer audit --locked --no-interaction
      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo "::warning title=composer audit::Advisories or abandoned packages found in composer.lock. See the previous step's log. This job is reporting-only."
