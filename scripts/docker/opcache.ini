; HAXcms opcache + realpath cache settings for the Docker image.
; Loaded after docker-php-ext-opcache.ini (zz- prefix sorts last).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
; HAXcms core + vendor is several thousand files
opcache.max_accelerated_files=20000
; keep checking for changed files so mounted/upgraded code is picked up
opcache.validate_timestamps=1
opcache.revalidate_freq=2
; page loads resolve many page/theme paths with realpath()
realpath_cache_size=4096K
realpath_cache_ttl=600
