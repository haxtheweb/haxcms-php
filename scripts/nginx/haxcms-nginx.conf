# HAXcms reference nginx snippet for production deployments.
#
# Security (F6/XSS, SEC-UPLOAD): uploaded browser-renderable markup (.html,
# .htm, .xhtml, .xml, .svg; case-insensitive) under any site /files/
# directory must be served with Content-Disposition: attachment so the
# browser downloads it instead of rendering it inline. Without this, an
# uploaded file executes as stored XSS in the site origin on nginx (Apache is
# covered by the root .htaccess <If> rule and the site files/.htaccess
# FilesMatch rule, but nginx has no .htaccess equivalent, so the rule must
# live in the server config).
#
# This mirrors the haxcms-nodejs Express middleware (app.js) which sets
# Content-Disposition: attachment for the same extensions under /files/, and
# the DDEV/dev rule in .ddev/nginx-site.conf.
#
# Encoding: nginx matches `location` regexes against the normalised URI
# ($uri), i.e. after percent-decoding and resolving `.`/`..` segments, so
# /files/x%2ehtml or /%66iles/x.html are matched as /files/x.html.
#
# Placement: apply this location block inside the HAXcms server block(s). It
# takes priority over prefix locations such as `location /`, but nginx uses
# the FIRST matching regex location in config order, so it MUST appear
# BEFORE any other regex location that could match these extensions (for
# example a static-asset `location ~* \.(?:jpg|png|svg|...)$` expires block),
# otherwise that block wins and this header is never added.
#
# `add_header` inside a location disables inheritance of server-level
# add_header directives, so nosniff is repeated here; `always` applies the
# headers to every status code, not only 2xx/3xx.
#
# Deny rules: because this block is a regex location, it also wins over any
# dotfile/backup-file deny regex placed BELOW it and over any plain-prefix
# deny such as `location /_config`. So (a) a hidden-file deny is nested inside
# this block (keeps /files/.secret.xml denied wherever the block is placed),
# (b) put your own deny regex locations (dotfiles, backups) ABOVE this block,
# and (c) protect the config directory with a `^~` prefix location, which
# stops nginx from evaluating regex locations at all once it matches:
#
#   location ^~ /_config { deny all; return 404; }
#
# (now included below together with system/backend/php and _archived; remove
# any existing plain `location /_config` so the `^~` version applies).
#
# HAXcms sites live under the configured sites directory (default _sites/),
# so uploaded files are reached as /_sites/<siteName>/files/<file>.html (and
# the system/user files tree under system/user/files/). The /files/ segment
# in the regex matches all of these regardless of the preceding path.

# Security (L-6): nginx has no .htaccess, so the directory denies that Apache
# gets from _config/.htaccess, system/backend/php/.htaccess and
# _archived/.htaccess must live here. `^~` prefix locations stop nginx from
# evaluating regex locations once they match, so these win regardless of
# order. Prefix them with your basePath if HAXcms is installed in a
# subdirectory (e.g. /haxcms/_config).
location ^~ /_config/ { deny all; return 404; }
location ^~ /system/backend/php/ { deny all; return 404; }
location ^~ /_archived/ { deny all; return 404; }
# _config/user/files holds PUBLIC user uploads (Apache re-allows it via its
# own .htaccess). The longer `^~` prefix wins over /_config/; because `^~`
# also skips the server-level /files/ regex below, the hidden-file deny and
# forced download of uploaded markup are repeated here (first match wins).
location ^~ /_config/user/files/ {
    location ~ /\.(?!well-known/) {
        deny all;
    }
    location ~* \.(?:html?|xhtml|xml|svg)$ {
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
    }
}

# Force-download uploaded markup so it cannot execute inline as stored XSS.
location ~* /files/.*\.(?:html?|xhtml|xml|svg)$ {
    # Hidden files (/files/.secret.xml, /files/.git/x.html) stay denied even
    # though this regex location would otherwise win over a server-level
    # dotfile deny further down the config. /.well-known/ stays reachable.
    location ~ /\.(?!well-known/) {
        deny all;
    }
    add_header Content-Disposition attachment always;
    add_header X-Content-Type-Options nosniff always;
}
