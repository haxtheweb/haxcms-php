# HAXcms reference nginx snippet for production deployments.
#
# Security (F6/XSS): uploaded .html files under any site /files/ directory
# must be served with Content-Disposition: attachment so the browser
# downloads them instead of rendering them inline. Without this, an uploaded
# .html file executes as stored XSS in the site origin on nginx (Apache is
# covered by the .htaccess SetEnvIfNoCase + Header rule, but nginx has no
# .htaccess equivalent, so the rule must live in the server config).
#
# This mirrors the haxcms-nodejs Express middleware (app.js) which sets
# Content-Disposition: attachment for /files/*.html, and the DDEV/dev rule in
# .ddev/nginx-site.conf. Apply this location block inside the HAXcms server
# block(s) on any production nginx deployment. The regex location takes
# priority over a prefix `location /` catch-all, so place it alongside the
# other location blocks (order among regex locations does not matter for
# matching priority vs prefix locations, but keep it before the catch-all for
# readability).
#
# HAXcms sites live under the configured sites directory (default _sites/),
# so uploaded files are reached as /_sites/<siteName>/files/<file>.html (and
# the system/user files tree under system/user/files/). The /files/ segment
# in the regex matches all of these regardless of the preceding path.

# Force-download uploaded HTML so it cannot execute inline as stored XSS.
location ~* /files/.*\.html?$ {
    add_header Content-Disposition attachment;
}
